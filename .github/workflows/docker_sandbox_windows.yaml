name: docker sandbox (Windows junction repro)

# Windows + Docker sandbox regression coverage for #1946 / #1982.
#
# The bug this catches only reproduces when a Windows host's NTFS
# junctions in `node_modules/@mulmoclaude/*` are bind-mounted into a
# Linux Docker container — they dangle inside the container and break
# every module resolver that doesn't honour NODE_PATH.
#
# The workflow:
#   1. `yarn install` on the Windows runner creates the workspace
#      junctions.
#   2. Docker Desktop switches to the Linux engine (WSL2 backend).
#   3. A single `docker run node:22-slim` reproduces the production
#      sandbox mount layout (primary node_modules read-only + the
#      per-package `/app/pkg_modules` fallback + NODE_PATH).
#   4. `test/sandbox-repro/probe.mjs` inline-implements both the buggy
#      parent-walk-only resolver and the fixed `require.resolve.paths()`
#      resolver, asserts the env reproduces the failure mode, and
#      asserts the fix pattern finds every preset package.
#
# Triggers on `paths:` filter so ordinary PRs pay no Windows CI cost;
# a daily schedule + manual `workflow_dispatch` catches drift in the
# Docker-Desktop-on-windows-latest environment itself.

on:
  # Scheduled canary — catches upstream env drift (yarn switching from
  # NTFS junctions to hardlinks, WSL2 changing how junctions surface,
  # Docker changing bind-mount semantics). The resolver code itself is
  # covered every PR by `test/plugins/test_preset_loader_node_path.ts`
  # in the ubuntu/macos matrix, so we don't burn Windows CI minutes on
  # every push. Manual re-run available via workflow_dispatch.
  schedule:
    - cron: "0 19 * * *" # Daily 19:00 UTC = 04:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-sandbox-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-junction-linux-container:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          # No `cache: yarn` — measured on this job, it makes it slower. See
          # lint_test_windows.yaml's setup-node step for the numbers.

      # Defender's realtime scan intermittently EPERMs the atomic renames
      # yarn / tsc do on Windows. Same rationale as lint_test_windows.
      - name: Disable Windows Defender realtime monitoring
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: yarn install (creates NTFS junctions in node_modules/@mulmoclaude/*)
        run: yarn install --frozen-lockfile --network-timeout 120000

      # Sanity: the workspace linker actually made a junction here. If not,
      # the whole test is meaningless (some future yarn version might switch
      # to hardlinks or copies — we want to fail loudly at that point).
      - name: Confirm yarn created NTFS junctions for @mulmoclaude/*
        shell: pwsh
        run: |
          $x = Get-Item node_modules/@mulmoclaude/x-plugin
          Write-Host "LinkType: $($x.LinkType)"
          Write-Host "Target:   $($x.Target)"
          if ($x.LinkType -ne "Junction") {
            throw "expected NTFS Junction, got '$($x.LinkType)' — probe assumption violated"
          }

      # Everything downstream loads workspace packages through their built
      # `dist/` — the probe's ESM check LOADS `@mulmoclaude/x-plugin` via the
      # resolver hook, and the #2052 end-to-end step boots the real
      # mcp-server.ts against `@mulmoclaude/core`, `@mulmobridge/protocol`,
      # `@mulmobridge/client` and the preset plugins. Production ships built
      # dist; this repro must too, and `yarn install` builds nothing (no
      # `prepare` scripts).
      #
      # One whole-workspace build rather than a hand-picked subset: a plugin
      # that grows a workspace dependency then fails to resolve it. That is
      # exactly how a standalone `yarn workspace @mulmoclaude/x-plugin run
      # build` step here broke this canary once x-plugin started importing
      # `@mulmoclaude/common`, which nothing had built yet.
      - name: Build every workspace package (the probe + MCP child import their dist)
        run: yarn build:packages:dev

      # Without this the bundle is absent, `buildMulmoclaudeServer` falls back
      # to tsx, and the timing below would keep measuring the old path (#2235).
      - name: Build the bundled MCP broker (what the spawn spec now points at)
        run: yarn build:mcp-broker

      # windows-latest ships Docker CLI + a Windows-only engine, no Docker
      # Desktop. Docker Desktop in CI needs UI dialogs on first launch and
      # is flake-prone. Instead we use the preinstalled WSL2 with Ubuntu +
      # native `docker.io`, which is headless and reliable.
      #
      # The Windows workspace at `${{ github.workspace }}` (`C:\a\...`) is
      # visible from WSL2 at `/mnt/c/a/...`. NTFS junctions on that FS
      # surface as Linux symlinks whose targets are Windows-style absolute
      # paths (`C:\Users\...`) that don't exist inside a Linux container's
      # mount namespace — the exact dangling-junction failure #1946/#1982
      # reproduces.
      - name: Set up WSL2 (Ubuntu-22.04)
        shell: pwsh
        run: |
          wsl --version
          # Every subsequent step calls `wsl -d Ubuntu-22.04`, so we
          # require that exact distro rather than any "Ubuntu"-family
          # match. A runner that ships only `Ubuntu` (no `-22.04`) would
          # otherwise skip install here and then error out on the
          # `-d Ubuntu-22.04` calls below. Codex review on PR #1984.
          $distros = @()
          try { $distros = wsl --list --quiet 2>$null } catch { }
          if (-not ($distros | Where-Object { $_.Trim() -eq "Ubuntu-22.04" })) {
            wsl --install -d Ubuntu-22.04 --no-launch
            Start-Sleep -Seconds 15
          }
          wsl -d Ubuntu-22.04 -u root -- uname -a

      - name: Install docker.io inside WSL2
        shell: pwsh
        run: |
          wsl -d Ubuntu-22.04 -u root -- bash -c "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io"

      - name: Start dockerd in the background inside WSL2
        shell: pwsh
        run: |
          # nohup + disown so dockerd survives the wsl -e exit.
          # --iptables=false because WSL2's kernel lacks iptables_nat.
          wsl -d Ubuntu-22.04 -u root -- bash -c "nohup dockerd --iptables=false --bridge=none > /var/log/dockerd.log 2>&1 &"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            $null = wsl -d Ubuntu-22.04 -u root -- docker info 2>&1
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            Write-Host "dockerd log:"
            wsl -d Ubuntu-22.04 -u root -- cat /var/log/dockerd.log
            throw "dockerd did not become ready in 60s inside WSL2"
          }
          Write-Host "dockerd is up:"
          wsl -d Ubuntu-22.04 -u root -- docker info --format "OSType: {{.OSType}}"

      - name: Pull node:22-slim inside WSL2
        shell: pwsh
        run: wsl -d Ubuntu-22.04 -u root -- docker pull node:22-slim

      # Path translation: PowerShell sees the workspace at `C:\a\<repo>\<repo>`;
      # WSL2 exposes the same Windows FS at `/mnt/c/a/<repo>/<repo>`. The
      # NTFS junctions in `node_modules/@mulmoclaude/*` surface there as
      # Linux symlinks with dangling Windows-style targets — which is
      # exactly the environment the probe wants to prove the fix survives.
      #
      # `server/plugins/resolvePresetRoot.ts` is bind-mounted to
      # `/app/server-plugins/resolvePresetRoot.ts` so probe.ts imports the
      # shipped code directly (no inline reimplementation). `tsx` is
      # `npm install -g`'d in the container so it can load the .ts import.
      - name: Run the sandbox regression probe (via WSL2 docker)
        shell: pwsh
        run: |
          $wsWin = "${{ github.workspace }}"
          $drive = $wsWin.Substring(0, 1).ToLower()
          $rest = $wsWin.Substring(3) -replace '\\', '/'
          $wsLinux = "/mnt/$drive/$rest"
          Write-Host "Windows workspace: $wsWin"
          Write-Host "WSL2 mount path:   $wsLinux"

          # The per-package `/app/pkg_modules/<scope>/<name>` fallback mounts come
          # from the SHIPPED `workspaceModuleMounts()` (via
          # print-mcp-container-spec.ts) — the same builder the real MCP child
          # uses. probe.ts iterates PRESET_PLUGINS, so a hand-maintained mount
          # list here rots the moment a preset is added: that is exactly how
          # `@mulmoclaude/google-plugin` (#2114) broke this canary while every
          # other preset still passed. Deriving the list makes that impossible.
          $spec = & node_modules/.bin/tsx test/sandbox-repro/print-mcp-container-spec.ts | ConvertFrom-Json

          $dockerArgs = @("run", "--rm")
          $dockerArgs += @("-v", "${wsLinux}/node_modules:/app/node_modules:ro")
          foreach ($mount in $spec.pkgModuleMounts) { $dockerArgs += @("-v", $mount) }
          $dockerArgs += @("-v", "${wsLinux}/server/plugins:/app/server-plugins:ro")
          $dockerArgs += @("-v", "${wsLinux}/server/agent/mcp-esm-loader.mjs:/app/server/agent/mcp-esm-loader.mjs:ro")
          $dockerArgs += @("-v", "${wsLinux}/server/agent/mcp-esm-bootstrap.mjs:/app/server/agent/mcp-esm-bootstrap.mjs:ro")
          $dockerArgs += @("-v", "${wsLinux}/test/sandbox-repro:/repro:ro")
          $dockerArgs += @("-e", "NODE_PATH=/app/node_modules:/app/pkg_modules")
          $dockerArgs += @("-w", "/app", "node:22-slim", "bash", "-c",
            "npm install -g tsx --silent && tsx --import file:///app/server/agent/mcp-esm-bootstrap.mjs /repro/probe.ts")

          Write-Host "pkg_modules mounts: $($spec.pkgModuleMounts.Count)"
          wsl -d Ubuntu-22.04 -u root -- docker @dockerArgs
          if ($LASTEXITCODE -ne 0) { throw "sandbox regression probe failed (exit $LASTEXITCODE)" }

      # ── #2052 diagnostics ────────────────────────────────────────────
      # The probe above runs from /repro, whose sibling package.json says
      # `type: module` — so it exercises the ESM resolver hook. The real MCP
      # child runs /app/server/agent/mcp-server.ts, and dockerBindMountArgs()
      # never mounts a package.json under /app. These steps put the SAME
      # diagnostic file in the production package scope and read off which
      # module format Node actually picks, with and without a /app manifest.
      #
      # They REPORT; they do not gate the job. Reading the log is the point.

      - name: "#2052 — diagnose: production layout (no /app/package.json)"
        shell: pwsh
        continue-on-error: true
        run: |
          $wsWin = "${{ github.workspace }}"
          $drive = $wsWin.Substring(0, 1).ToLower()
          $rest = $wsWin.Substring(3) -replace '\\', '/'
          $wsLinux = "/mnt/$drive/$rest"

          wsl -d Ubuntu-22.04 -u root -- docker run --rm `
            -v "${wsLinux}/node_modules:/app/node_modules:ro" `
            -v "${wsLinux}/packages/plugins/x-plugin:/app/pkg_modules/@mulmoclaude/x-plugin:ro" `
            -v "${wsLinux}/server/agent/mcp-esm-loader.mjs:/app/server/agent/mcp-esm-loader.mjs:ro" `
            -v "${wsLinux}/server/agent/mcp-esm-bootstrap.mjs:/app/server/agent/mcp-esm-bootstrap.mjs:ro" `
            -v "${wsLinux}/test/sandbox-repro/diagnose-2052.ts:/app/server/agent/diagnose-2052.ts:ro" `
            -e NODE_PATH=/app/node_modules:/app/pkg_modules `
            -w /app `
            node:22-slim `
            bash -c "npm install -g tsx --silent && tsx --import file:///app/server/agent/mcp-esm-bootstrap.mjs /app/server/agent/diagnose-2052.ts"

      - name: "#2052 — diagnose: same, but with a {type:module} /app/package.json"
        shell: pwsh
        continue-on-error: true
        run: |
          $wsWin = "${{ github.workspace }}"
          $drive = $wsWin.Substring(0, 1).ToLower()
          $rest = $wsWin.Substring(3) -replace '\\', '/'
          $wsLinux = "/mnt/$drive/$rest"

          # The candidate fix, expressed as one extra bind mount.
          wsl -d Ubuntu-22.04 -u root -- docker run --rm `
            -v "${wsLinux}/node_modules:/app/node_modules:ro" `
            -v "${wsLinux}/packages/plugins/x-plugin:/app/pkg_modules/@mulmoclaude/x-plugin:ro" `
            -v "${wsLinux}/server/agent/mcp-esm-loader.mjs:/app/server/agent/mcp-esm-loader.mjs:ro" `
            -v "${wsLinux}/server/agent/mcp-esm-bootstrap.mjs:/app/server/agent/mcp-esm-bootstrap.mjs:ro" `
            -v "${wsLinux}/test/sandbox-repro/package.json:/app/package.json:ro" `
            -v "${wsLinux}/test/sandbox-repro/diagnose-2052.ts:/app/server/agent/diagnose-2052.ts:ro" `
            -e NODE_PATH=/app/node_modules:/app/pkg_modules `
            -w /app `
            node:22-slim `
            bash -c "npm install -g tsx --silent && tsx --import file:///app/server/agent/mcp-esm-bootstrap.mjs /app/server/agent/diagnose-2052.ts"

      # ── #2052 end-to-end: the real MCP child, the shipped mounts ──────
      # The regression this closes: `workspacePackageDirs()` only listed
      # `@mulmoclaude/*`, so `@mulmobridge/protocol` (reached via
      # src/types/events.ts) had no /app/pkg_modules fallback. Its junction
      # dangled inside the container and mcp-server.ts died at load — every
      # tool, `handlePermission` included, vanished from the agent registry.
      #
      # Mounts / env / argv come from the SHIPPED builders via
      # print-mcp-container-spec.ts, so this can never drift the way the
      # hardcoded smoke test did.
      #
      # The handshake is driven through /repro/time-broker-handshake.sh, which
      # stamps how long the broker takes to answer — the input #2235 needs to
      # decide between prebuilding the broker and deferring its imports (#2233).
      # The assertions below are unchanged; the timing rides along and reports.
      - name: "#2052 — end-to-end: real mcp-server.ts answers initialize + tools/list (+ #2233 cold-boot timing)"
        shell: pwsh
        run: |
          $wsWin = "${{ github.workspace }}"
          $drive = $wsWin.Substring(0, 1).ToLower()
          $rest = $wsWin.Substring(3) -replace '\\', '/'
          $wsLinux = "/mnt/$drive/$rest"

          $spec = & node_modules/.bin/tsx test/sandbox-repro/print-mcp-container-spec.ts | ConvertFrom-Json

          $dockerArgs = @("run", "--rm", "-i")
          $dockerArgs += @("-v", "${wsLinux}/node_modules:/app/node_modules:ro")
          $dockerArgs += @("-v", "${wsLinux}/packages:/app/packages:ro")
          $dockerArgs += @("-v", "${wsLinux}/server:/app/server:ro")
          $dockerArgs += @("-v", "${wsLinux}/src:/app/src:ro")
          $dockerArgs += @("-v", "${wsLinux}/test/sandbox-repro:/repro:ro")
          foreach ($mount in $spec.pkgModuleMounts) { $dockerArgs += @("-v", $mount) }
          foreach ($entry in $spec.env.PSObject.Properties) { $dockerArgs += @("-e", "$($entry.Name)=$($entry.Value)") }
          # `npm install -g tsx` stays OUTSIDE the timed window: the shipped
          # sandbox image already carries tsx, so counting it would inflate a
          # number that production never pays.
          $dockerArgs += @("-w", "/app", "node:22-slim", "bash", "-c",
            "npm install -g tsx --silent && bash /repro/time-broker-handshake.sh $($spec.command) $($spec.args -join ' ')")

          Write-Host "pkg_modules mounts: $($spec.pkgModuleMounts.Count)"
          $runClock = [System.Diagnostics.Stopwatch]::StartNew()
          $out = wsl -d Ubuntu-22.04 -u root -- docker @dockerArgs 2>&1 | Out-String
          $runClock.Stop()
          Write-Host $out

          # #2233 timing is published BEFORE the assertions below: a broker slow
          # enough to fail them is exactly when the number is worth reading, and
          # a thrown assertion would skip everything after it.
          $measured = @{}
          foreach ($match in [regex]::Matches($out, 'TIMING (\w+) (\w+) (\d+)')) {
            $measured["$($match.Groups[1].Value)/$($match.Groups[2].Value)"] = [int]$match.Groups[3].Value
          }
          function Format-Timing($key) {
            if ($measured.ContainsKey($key)) { "$($measured[$key]) ms" } else { "not reported" }
          }
          $summary = @(
            '### MCP broker cold-boot timing (#2233)'
            ''
            'Measured inside the sandbox container over the Windows bind mount, from broker spawn to the response line. That is the window the CLI waits through before it gives up and reports `handlePermission not found` (#2201) - not the same as how long the process runs in total.'
            ''
            '| run | `initialize` answered | `tools/list` answered |'
            '|---|---|---|'
            "| cold (first read over the mount) | $(Format-Timing 'cold/initialize') | $(Format-Timing 'cold/tools_list') |"
            "| warm (page cache hot) | $(Format-Timing 'warm/initialize') | $(Format-Timing 'warm/tools_list') |"
            ''
            "Whole ``docker run``: $([int]$runClock.Elapsed.TotalMilliseconds) ms. That figure includes the one-off ``npm install -g tsx`` which production does not pay, so read the table for the boot cost, not this."
            ''
            'Before tuning anything to these numbers: a shared runner under WSL2 9p is the same *class* of slow mount as Docker Desktop file sharing but not the same absolute values, and `npm install -g tsx` leaves node warmer here than a fresh production container would be. Treat `cold` as a floor, not a worst case.'
          )
          $summaryText = $summary -join "`n"
          # Echo it too: the job summary tab has no API, so this is the only way
          # to see what was actually published (a mis-parsed TIMING line renders
          # as "not reported" and would otherwise look like a real measurement).
          Write-Host $summaryText
          $summaryText | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # Assert per run, not over the combined output: `$out` now holds two
          # handshakes, so a substring match anywhere would let a warm success
          # cover for a cold failure — and the cold run is the one that models
          # the startup race this canary exists to catch.
          foreach ($run in @("cold", "warm")) {
            $result = [regex]::Match($out, "RESULT $run serverInfo=(\w+) handlePermission=(\w+)")
            if (-not $result.Success) {
              throw "[$run] the handshake produced no RESULT line — the child died before answering. See stderr above."
            }
            if ($result.Groups[1].Value -ne "yes") {
              throw "[$run] MCP server never answered initialize — the child died at load. See stderr above."
            }
            if ($result.Groups[2].Value -ne "yes") {
              throw "[$run] tools/list did not include handlePermission — this is the #2052 symptom."
            }
          }
          Write-Host "OK: mcp-server.ts started and listed handlePermission under real NTFS junctions (cold and warm)."

      - name: "#2052 — reproduce the crash verbatim (static import, production layout)"
        shell: pwsh
        continue-on-error: true
        run: |
          $wsWin = "${{ github.workspace }}"
          $drive = $wsWin.Substring(0, 1).ToLower()
          $rest = $wsWin.Substring(3) -replace '\\', '/'
          $wsLinux = "/mnt/$drive/$rest"

          # Expected to exit non-zero BEFORE the fix, with the exact
          # `Cannot find module '@mulmoclaude/x-plugin'` + `Require stack:`
          # trace from the issue. That is the reproduction.
          wsl -d Ubuntu-22.04 -u root -- docker run --rm `
            -v "${wsLinux}/node_modules:/app/node_modules:ro" `
            -v "${wsLinux}/packages/plugins/x-plugin:/app/pkg_modules/@mulmoclaude/x-plugin:ro" `
            -v "${wsLinux}/server/agent/mcp-esm-loader.mjs:/app/server/agent/mcp-esm-loader.mjs:ro" `
            -v "${wsLinux}/server/agent/mcp-esm-bootstrap.mjs:/app/server/agent/mcp-esm-bootstrap.mjs:ro" `
            -v "${wsLinux}/test/sandbox-repro/static-import-2052.ts:/app/server/agent/static-import-2052.ts:ro" `
            -e NODE_PATH=/app/node_modules:/app/pkg_modules `
            -w /app `
            node:22-slim `
            bash -c "npm install -g tsx --silent && tsx --import file:///app/server/agent/mcp-esm-bootstrap.mjs /app/server/agent/static-import-2052.ts"
