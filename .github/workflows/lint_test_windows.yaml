name: lint_test (Windows)

# The Windows half of the lint_test matrix, split out of pull_request.yaml
# in #1585 so PR CI doesn't pay the Windows wall-clock cost (NTFS tar
# extraction + Defender + slower tsc across the 25 packages/* workspaces)
# on every push.
#
# Coverage cadence:
#   - schedule: daily, so a Windows-only regression surfaces within a day
#   - push to main: catches regressions immediately after merge
#   - workflow_dispatch: manual rerun
#
# Steps mirror the lint_test job in pull_request.yaml (ubuntu/macos
# variant). Keep them in sync when adding new gates.

on:
  schedule:
    - cron: "0 18 * * *" # Daily 18:00 UTC = 03:00 JST (matches e2e_live_no_llm)
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '**/*.md'
  # Two areas can only be verified ON Windows, and both would otherwise first
  # run after merge, on push to main — too late to be a gate. Scoped by path so
  # ordinary PRs still don't pay for a Windows runner (#2613); the list earns
  # entries one demonstrated failure at a time rather than by category.
  #
  #   server/utils/launcher, test/utils/launcher — the icon launcher's Windows
  #     half: a .lnk is written by a COM object and the hand-assembled .ico is
  #     loadable or not at Windows' discretion.
  #
  #   packages/client — process and stream control, where Windows differs by
  #     DESIGN rather than by accident: it has no catchable SIGTERM, so
  #     `subprocess.kill()` terminates the target unconditionally whatever name
  #     it is given. `installProcessGuards` and its shutdown-deadline test live
  #     here, and that difference took main red for a day (#3084 → #3122): the
  #     test passed on every POSIX runner and could not pass on Windows, and
  #     nothing ran Windows before the merge that broke it.
  #
  #   server/system, test/system — POSIX file modes, which Windows does not
  #     carry: it maps only the read-only bit, so a `0o600` write reads back as
  #     `0o666` and an assertion on the mode cannot pass there. The secret store
  #     took main red the same way (#3238 → #3251), for half a day, and again
  #     the test was green on every POSIX runner.
  pull_request:
    paths:
      - 'server/utils/launcher/**'
      - 'test/utils/launcher/**'
      - 'server/system/**'
      - 'test/system/**'
      - 'packages/client/**'
      - '.github/workflows/lint_test_windows.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-test-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_test_windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # no git push; zizmor artipacked
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # Deliberately no `cache: yarn`. It does work — `[3/5] Fetching
          # packages` is 73-86% of this install (148-321s) and the cache
          # collapses install to 51-79s — but restoring the 2.2 GB entry on
          # NTFS costs 178-247s, which spends the whole saving. Measured warm:
          # 256s / 319s here and 311s in docker_sandbox_windows, against
          # baselines of 274s and 232.5s. It also saves in 457s on every
          # yarn.lock change and evicts ~2.2 GB of other caches (#2859).
          # Re-test before re-proposing; don't re-derive it from the fetch
          # share alone.
      # Disable Defender realtime monitoring to prevent EPERM on
      # atomic rename during yarn install / build.
      - name: Disable Windows Defender realtime monitoring
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell
      # Cache node_modules directly (faster than yarn cache because it
      # skips the tar extract → yarn install file-write cycle).
      # restore-keys lets a yarn.lock change land on a warm node_modules
      # tree (yarn install fills in the diff) instead of a cold cache.
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: win-node-modules-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            win-node-modules-${{ matrix.node-version }}-
      # Puppeteer downloads its browsers into ~/.cache/puppeteer during the
      # `yarn install` postinstall — outside node_modules, so the cache above
      # doesn't cover it, and the PDF-route tests in test:coverage launch it.
      # Restored BEFORE install so the postinstall skips the download on a hit.
      # Keyed on yarn.lock (busts on a puppeteer bump); restore-keys keeps a
      # warm browser across unrelated lockfile changes.
      - name: Cache puppeteer browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-
      - run: yarn install --frozen-lockfile --network-timeout 120000
      # Cache the output of `yarn build:packages` keyed on the source
      # files it consumes. The 25 @mulmobridge/* workspaces all run tsc
      # serially / pairwise — the slowest non-install step on Windows.
      # When no package source / tsconfig / package.json changed, skip
      # the build step entirely. Cache key includes runner.os and node
      # version because emitted JS can differ across them.
      - name: Cache packages/dist
        id: pkg-dist-cache
        uses: actions/cache@v6
        with:
          path: |
            packages/*/dist
            packages/bridges/*/dist
            packages/plugins/*/dist
            packages/services/*/dist
          key: pkg-dist-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('packages/*/src/**', 'packages/*/tsconfig.json', 'packages/*/package.json', 'packages/bridges/*/src/**', 'packages/bridges/*/tsconfig.json', 'packages/bridges/*/package.json', 'packages/plugins/*/src/**', 'packages/plugins/*/tsconfig.json', 'packages/plugins/*/package.json', 'packages/services/*/src/**', 'packages/services/*/tsconfig.json', 'packages/services/*/package.json', 'build-config/tsconfig.packages.json', 'yarn.lock', 'package.json') }}
      - name: Build internal packages (required before typecheck)
        if: steps.pkg-dist-cache.outputs.cache-hit != 'true'
        run: yarn build:packages
      - run: yarn run typecheck
      - run: yarn run lint
      # Plugin barrel codegen must be in sync — fail the build if a
      # developer added a plugin dir without re-running the codegen.
      - run: yarn run plugins:codegen:check
      - run: yarn run build
      # Bundle integrity: `yarn build` regenerates committed esbuild
      # artifacts. If a developer changed the TS source but forgot to
      # commit the new bundle, this fails.
      - name: Verify built hook bundles are up-to-date
        run: git diff --exit-code -- server/workspace/wiki-history/hook/snapshot.mjs server/build/dispatcher.mjs
      - run: yarn run test:coverage
      # Subprocess-mode env-bound smoke for `requireSameOrigin` (#1463).
      - run: yarn run test:csrf-wiring
