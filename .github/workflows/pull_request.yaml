name: Node.js CI

on:
  pull_request:
    branches:
      - main
    # Skip when ALL changed files are docs / plans / top-level markdown.
    # Applied to lint_test + e2e — both jobs in this workflow are
    # value-added only when source / config / tests change. PRs that
    # only move plan files (e.g. plans/ → plans/done/ chore PRs) or
    # tweak markdown docs go straight to mergeable. paths-ignore is
    # AND-style: a PR that mixes a code change and a doc change still
    # runs CI in full.
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '**/*.md'
  push:
    branches:
      - main

concurrency:
  # The `github.run_id` fallback puts every push-to-main run in a group of its
  # own — main CI must never be cancelled or queued behind an earlier commit.
  # `run_attempt` keeps a manual re-run of an old run from cancelling the
  # in-flight run of a newer commit on the same PR.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: ${{ github.run_attempt == '1' }}

permissions:
  contents: read

jobs:
  # Detect whether a PR has any changes outside src/lang/**. Translation-only
  # PRs are gated out of e2e because rendered strings don't change browser
  # behavior, and `vue-tsc` (in lint_test below) already enforces the
  # 8-locale lockstep at the type level — a missing or extra key fails the
  # type check before it can land. Push events always run the full suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.filter.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false  # no git push; zizmor artipacked
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qv '^src/lang/'; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
          fi

  # ubuntu + macos lint matrix. Windows runs in a separate scheduled
  # workflow (`.github/workflows/lint_test_windows.yaml`, #1585) so PR
  # CI doesn't pay the Windows wall-clock cost on every push — Windows
  # is covered daily and on every main push instead.
  lint_test:
    runs-on: ${{ matrix.os }}
    # 30, not 20: the macOS cells sit far closer to the cap than ubuntu.
    # Over 60 runs the macOS p90 was 18.0-19.3 min against a 20 min cap
    # (ubuntu p90 13.9-15.5), and 5 of those runs had a macOS cell killed
    # at exactly 20 min while every ubuntu sibling passed. Runner speed
    # also drifts day to day - on 2026-08-28 the macOS median was 17.7.
    # A lockfile-touching PR is the worst case: setup-node's yarn cache
    # and the packages/dist cache below both key on the lockfile with no
    # restore-key, so a dep bump pays a cold install AND a cold
    # build:packages (#3005: 42s -> 2m26s and 1m11s -> 2m25s). The
    # puppeteer cache has a restore-key and stays warm, so it is not part
    # of this. 30 matches the Windows sibling job. A cap is a runaway
    # guard, not a perf budget - raising it costs nothing on a healthy
    # run. (#3007)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false  # no git push; zizmor artipacked
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn
    # Puppeteer's postinstall downloads chrome + chrome-headless-shell
    # (~120 MB) into ~/.cache/puppeteer during `yarn install` — the PDF-route
    # tests in test:coverage launch it. That dir lives OUTSIDE node_modules and
    # the yarn cache, so without this it re-downloads on every cell of the
    # matrix. Restored BEFORE install so the postinstall finds the browser and
    # skips the download. Keyed on yarn.lock (busts on a puppeteer bump);
    # restore-keys lets an unrelated lockfile change still land on a warm
    # browser (postinstall re-downloads only if the pinned revision differs).
    - name: Cache puppeteer browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/puppeteer
        key: puppeteer-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          puppeteer-${{ runner.os }}-
    - run: yarn install --frozen-lockfile --network-timeout 120000
    # Cache the output of `yarn build:packages` keyed on the source
    # files it consumes. The 25 @mulmobridge/* workspaces all run tsc
    # serially / pairwise — the slowest non-install step. When no
    # package source / tsconfig / package.json changed, skip the
    # build step entirely. Cache key includes runner.os and node
    # version because emitted JS can differ across them.
    - name: Cache packages/dist
      id: pkg-dist-cache
      uses: actions/cache@v6
      with:
        path: |
          packages/*/dist
          packages/bridges/*/dist
          packages/plugins/*/dist
          packages/services/*/dist
        key: pkg-dist-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('packages/*/src/**', 'packages/*/tsconfig.json', 'packages/*/package.json', 'packages/bridges/*/src/**', 'packages/bridges/*/tsconfig.json', 'packages/bridges/*/package.json', 'packages/plugins/*/src/**', 'packages/plugins/*/tsconfig.json', 'packages/plugins/*/package.json', 'packages/services/*/src/**', 'packages/services/*/tsconfig.json', 'packages/services/*/package.json', 'build-config/tsconfig.packages.json', 'yarn.lock', 'package.json') }}
    - name: Build internal packages (required before typecheck)
      if: steps.pkg-dist-cache.outputs.cache-hit != 'true'
      run: yarn build:packages
    - run: yarn run typecheck
    # One eslint process covers the whole repo with type-aware rules, which hold
    # the TypeScript program in memory: measured peak RSS 3.86 GB. Node picks its
    # default heap from machine RAM, so the ubuntu runners (16 GB → ~4 GB heap)
    # cleared it by a hair while the macOS arm64 runners (7 GB → ~2 GB) did not —
    # same command, half the budget, `exit 134` on macOS only (#3093).
    #
    # Reproduced locally by capping the heap to the macOS value: 2048 aborts with
    # the identical FATAL, 4096 and 6144 complete. 4096 is what ubuntu already
    # had and it was only just enough, so this is 6144 — headroom rather than the
    # next tipping point. The lint scope only grows.
    - run: yarn run lint
      env:
        NODE_OPTIONS: --max-old-space-size=6144
    # Plugin barrel codegen must be in sync — fail the build if a
    # developer added a plugin dir without re-running the codegen.
    # `yarn run build` regenerates them via prebuild, but we want a
    # standalone signal so the PR diff doesn't accidentally hide the
    # drift inside `node_modules` or the dist artifact.
    - run: yarn run plugins:codegen:check
    # #1920 anti-regression: root ↔ launcher package.json + plugin peer
    # dep sync gate. Yarn workspaces symlink the launcher into
    # node_modules so local dev never touches its dependency field;
    # this catches drift at PR time before it reaches an `npx
    # mulmoclaude` user.
    - run: yarn run check:launcher-sync
    # #2967: a help file moved to packages/core/assets/ and a manifest was
    # deleted, and the docs kept linking at the old paths for months — the
    # link still READS fine, so only a reader who clicks finds out. It took an
    # outside contributor to notice. Cheap to check, so check it every PR.
    - run: yarn run check:doc-links
    # #2989: a plugin's Tailwind build scans only its own package, so classes
    # declared in core (the shared enum palette) dropped out of the plugin's
    # dist/style.css while the host app kept rendering them — invisible unless
    # you load the plugin AS a package. The fix is one `@source` line; this is
    # what makes the next shared palette fail loudly instead of silently.
    - run: yarn run check:plugin-css
    - run: yarn run build
    # Bundle integrity: `yarn build` regenerates committed esbuild
    # artifacts (`server/workspace/wiki-history/hook/snapshot.mjs`
    # and `server/build/dispatcher.mjs`). If a developer changed the
    # TS source but forgot to commit the new bundle, this fails —
    # without the check a stale bundle would silently land on main.
    # Limited to the build outputs we know about so edits to other
    # generated files (e.g. dist/, packages/*/dist) don't
    # false-positive. The dispatcher bundle is sourcemap-free so its
    # output is deterministic across rebuilds — this gate would have
    # flapped on the old inline-sourcemap output. (Codex review
    # iter-1 #955.)
    - name: Verify built hook bundles are up-to-date
      run: git diff --exit-code -- server/workspace/wiki-history/hook/snapshot.mjs server/build/dispatcher.mjs
    - run: yarn run test:coverage
    # Subprocess-mode env-bound smoke for `requireSameOrigin` (#1463).
    # The main `test:coverage` glob exercises the env-UNSET path; this
    # step re-runs the same spec with `MULMOCLAUDE_TRUSTED_ORIGINS` set
    # so the EXPORTED middleware is exercised against a listed LAN
    # origin. Catches a typo like `requireSameOriginWith([])` at the
    # export site that the in-process suite cannot see (Node's ESM
    # resolver caches `env.ts` on first import).
    - run: yarn run test:csrf-wiring

  # Single Yarn 4 cell — Yarn 1 stays the primary tool for the lint_test
  # matrix, but this guards against duplicate-workspace-name (Yarn 4 is
  # strict where v1 was lenient) and pre-script removal regressions
  # (Berry doesn't run pre*/post* hooks; #956). Linux + Node 24 only.
  yarn4_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # no git push; zizmor artipacked
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable Yarn 4 via Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.14.1 --activate
          yarn --version
      # yarn.lock is v1 format (yarn 1 is the primary tool); Yarn 4
      # migrates it on install. Hardened mode auto-activates on public
      # PR runs and forbids that migration, failing with YN0028. The
      # smoke goal is "does the workspace install at all", not
      # lockfile-format drift, so opt out for this cell only. Risk
      # surface is unchanged: lint_test (yarn 1) covers the same
      # lockfile.
      - name: yarn install (Yarn 4)
        env:
          # CI auto-enables both: hardened mode (public-PR safety) and
          # immutable-installs (treats CI=true as --immutable). Both
          # forbid the v1 → v6 lockfile migration that has to happen
          # to install at all.
          YARN_ENABLE_HARDENED_MODE: "false"
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: yarn install
      - name: yarn build:packages (verifies the dev/build script chain has no pre* dependency)
        run: yarn build:packages
      - name: yarn build
        run: yarn build
      - name: yarn lint
        run: yarn lint
      # Run the four typecheck pieces that are pure `tsc` calls; skip
      # `typecheck:packages` (= `yarn workspaces run typecheck`) which is
      # Yarn 1-only syntax. Same for `yarn test`'s tail
      # (`yarn workspaces run test`) — covered by lint_test on Yarn 1.
      - name: yarn typecheck (vue / server / test / e2e — skip :packages)
        run: yarn typecheck:vue && yarn typecheck:server && yarn typecheck:test && yarn typecheck:e2e

  e2e:
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Split the 268-test e2e suite across 2 parallel runners via
    # Playwright's --shard. Wall clock drops from ~8 min to ~4-5 min
    # at the cost of running twice the runner-minutes (no impact for
    # OSS / free tier). fail-fast off so a flake on shard 1 doesn't
    # mask a real failure on shard 2.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false  # no git push; zizmor artipacked
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'yarn'
    - run: yarn install --frozen-lockfile --network-timeout 120000
    # Same packages/dist cache as lint_test — shares the cache key
    # across both jobs on ubuntu-latest + node 22.x, so whichever
    # finishes building first warms the cache for the other.
    - name: Cache packages/dist
      id: pkg-dist-cache
      uses: actions/cache@v6
      with:
        path: |
          packages/*/dist
          packages/bridges/*/dist
          packages/plugins/*/dist
          packages/services/*/dist
        key: pkg-dist-${{ runner.os }}-22.x-${{ hashFiles('packages/*/src/**', 'packages/*/tsconfig.json', 'packages/*/package.json', 'packages/bridges/*/src/**', 'packages/bridges/*/tsconfig.json', 'packages/bridges/*/package.json', 'packages/plugins/*/src/**', 'packages/plugins/*/tsconfig.json', 'packages/plugins/*/package.json', 'packages/services/*/src/**', 'packages/services/*/tsconfig.json', 'packages/services/*/package.json', 'build-config/tsconfig.packages.json', 'yarn.lock', 'package.json') }}
    - name: Build internal packages
      if: steps.pkg-dist-cache.outputs.cache-hit != 'true'
      run: yarn build:packages
    # Cache the ~392 MB of Playwright browser binaries (chromium + webkit +
    # headless shell + ffmpeg) so a normal run restores them in seconds instead
    # of re-downloading from the CDN every time. A slow CDN day was stretching
    # the download to ~13 min and tipping shard 1 over its job timeout (the e2e
    # flakes seen on #1725). Keyed on the Playwright version, which determines
    # the exact browser builds.
    - name: Resolve Playwright version
      id: pw-version
      run: |
        VERSION=$(node -p "require('@playwright/test/package.json').version")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
    # Both install steps below shell out to apt, and apt's post-install service
    # restarts are the likeliest way a daemon ends up holding this step's
    # stdout (see the redirect below). List what needs restarting instead of
    # restarting it. This cannot be a step `env:` — playwright runs apt as
    # `sudo -- sh -c` with no `-E`, so sudo's env_reset would drop
    # NEEDRESTART_SUSPEND before apt ever saw it, and the setting would look
    # applied while doing nothing.
    - name: Keep apt from restarting services
      run: |
        sudo mkdir -p /etc/needrestart/conf.d
        sudo tee /etc/needrestart/conf.d/99-github-ci.conf > /dev/null <<'CONF'
        $nrconf{restart} = "l";
        $nrconf{kernelhints} = 0;
        CONF
    # Download only — `--with-deps` would fold apt into this step, and then the
    # tight cap the apt part needs would also apply to a 392 MB download that
    # the comment above has measured at ~13 min on a bad CDN day. Deliberately
    # uncapped: the job's own 15 minutes already bound it, and any step cap
    # above the known worst case would be decoration.
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium webkit > "$RUNNER_TEMP/playwright-install.log" 2>&1 || { cat "$RUNNER_TEMP/playwright-install.log"; exit 1; }
    # Unconditional: the OS-level libraries live in system paths, not
    # ~/.cache/ms-playwright, so the cache never carries them and both the hit
    # and miss paths need this.
    #
    # The redirect is the fix for #2805, not tidiness. playwright-core spawns
    # apt with `stdio: "inherit"` and awaits `exit` rather than `close`, so apt's
    # children hold the runner's own pipe while playwright itself returns at
    # once. The runner keeps a step open until that pipe reaches EOF, so a
    # daemon apt leaves behind wedges the step: measured at 23-27s of work then
    # silence to the 15-minute job timeout, three PRs running, with the suite
    # never starting. Sending the fd to a file means a survivor holds the file
    # instead. The cap bounds anything that still slips through, so a wedge
    # costs 3 minutes rather than the whole budget — and it is safe to keep
    # tight here precisely because this step no longer carries the download.
    - name: Install Playwright OS dependencies
      timeout-minutes: 3
      run: npx playwright install-deps chromium webkit > "$RUNNER_TEMP/install-deps.log" 2>&1 || { cat "$RUNNER_TEMP/install-deps.log"; exit 1; }
    - name: Run E2E tests (shard ${{ matrix.shard }}/2)
      run: yarn test:e2e --shard=${{ matrix.shard }}/2
    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-results-shard-${{ matrix.shard }}
        path: test-results/
        retention-days: 7
